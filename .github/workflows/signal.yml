name: MA Signal

on:
  schedule:
    # 20:40 UTC = 다음날 05:40 KST
    # GitHub 예약 실행은 30분 지연될 수 있어 30분 앞당겨 둡니다.
    # UTC 일~금(0-5) = KST 월~토 → 일요일 수신 제외
    - cron: "40 20 * * 0-5"
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼

concurrency:
  group: ma-signal
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 시그널 계산 및 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALWAYS_SEND: "true"     # "false"로 바꾸면 시그널 있을 때만 알림
          TZ: Asia/Seoul
        run: python ma_signal.py

      - name: 실패 시 알림
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=⚠️ 시그널 워크플로 실패. Actions 로그를 확인하세요.
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
